<!DOCTYPE html>
<html lang="ar">
<head><meta charset="UTF-8"><title>توليد الأيقونات</title></head>
<body style="background:#070B18;color:#fff;font-family:sans-serif;text-align:center;padding:40px;">
  <h2>جاري توليد الأيقونات الرسمية بدقة عالية...</h2>
  <canvas id="canvas" style="display:none;"></canvas>
  <script>
    function drawIcon(size, filename) {
      const canvas = document.getElementById('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // الخلفية العميقة المتدرجة
      const bgGrad = ctx.createRadialGradient(size*0.5, size*0.4, size*0.05, size*0.5, size*0.5, size*0.7);
      bgGrad.addColorStop(0, '#101B3B');
      bgGrad.addColorStop(0.5, '#0A1128');
      bgGrad.addColorStop(1, '#050814');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, size, size);

      // هالة إضاءة النجوم الخلفية
      const glowGrad = ctx.createRadialGradient(size*0.5, size*0.5, 0, size*0.5, size*0.5, size*0.45);
      glowGrad.addColorStop(0, 'rgba(34, 211, 238, 0.25)');
      glowGrad.addColorStop(0.6, 'rgba(37, 99, 235, 0.12)');
      glowGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, size, size);

      // حلقة النجوم الدائرية المحيطة
      ctx.save();
      ctx.translate(size/2, size/2);
      const numStars = 8;
      const ringRadius = size * 0.33;
      for (let i = 0; i < numStars; i++) {
        const angle = (i * 2 * Math.PI) / numStars;
        const x = Math.cos(angle) * ringRadius;
        const y = Math.sin(angle) * ringRadius;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle + Math.PI / 2);
        drawStar(ctx, 0, 0, 5, size * 0.045, size * 0.022, 'rgba(255,255,255,0.3)');
        ctx.restore();
      }
      ctx.restore();

      // النجمة المركزية الكبرى الفاخرة (3D Faceted Star)
      const cx = size / 2, cy = size / 2;
      const spikes = 5;
      const outerR = size * 0.27;
      const innerR = size * 0.115;
      const rot = Math.PI / 2 * 3;

      let points = [];
      let step = Math.PI / spikes;

      for (let i = 0; i < spikes * 2; i++) {
        let r = (i % 2 === 0) ? outerR : innerR;
        let x = cx + Math.cos(rot + i * step) * r;
        let y = cy + Math.sin(rot + i * step) * r;
        points.push({x, y});
      }

      // رسم أوجه النجمة لإعطائها بعداً مجسماً حقيقياً
      for (let i = 0; i < points.length; i++) {
        let p1 = points[i];
        let p2 = points[(i + 1) % points.length];
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.closePath();

        const grad = ctx.createLinearGradient(cx, cy, p1.x, p1.y);
        if (i % 2 === 0) {
          grad.addColorStop(0, '#22D3EE');
          grad.addColorStop(1, '#38BDF8');
        } else {
          grad.addColorStop(0, '#0284C7');
          grad.addColorStop(1, '#1E40AF');
        }
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = size * 0.003;
        ctx.stroke();
      }

      // إضافة انعكاس زجاجي علوي
      ctx.beginPath();
      ctx.arc(size*0.5, size*0.5, size*0.42, Math.PI, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.fill();

      // تنزيل الملف
      const a = document.createElement('a');
      a.download = filename;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, fill) {
      let rot = Math.PI / 2 * 3;
      let x = cx, y = cy;
      let step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    }

    window.onload = () => {
      // توليد الملفات الثلاثة بنفس التسميات والمقاسات المطلوبة في الـ Manifest
      setTimeout(() => drawIcon(192, 'ucl-icon-192.png'), 200);
      setTimeout(() => drawIcon(512, 'ucl-icon-512.png'), 700);
      setTimeout(() => drawIcon(512, 'ucl-icon-maskable.png'), 1200);
    };
  </script>
</body>
</html>
