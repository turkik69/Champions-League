name: Fix Gulf Cup final 2026

on:
  push:
    paths:
      - gulf-schedule.json
      - scripts/fix_gulf_final_2026.py
      - .github/workflows/fix-gulf-final-2026.yml

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch final prediction and knockout flow
        run: python scripts/fix_gulf_final_2026.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker-v2.js gulf.js gulf.css gulf.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Gulf Cup final knockout prediction flow"
            git push
          fi
