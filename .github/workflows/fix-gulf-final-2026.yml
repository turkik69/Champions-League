name: Fix Gulf Cup final 2026

on:
  push:
    paths:
      - gulf-schedule.json
      - scripts/fix_gulf_final_2026.py
      - .github/workflows/fix-gulf-final-2026.yml

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch final prediction alert logic
        run: python scripts/fix_gulf_final_2026.py
      - name: Commit worker update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker-v2.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Open Gulf Cup final predictions and recover late final alert"
            git push
          fi
