name: Refresh iOS install metadata
on:
  push:
    paths:
      - '.github/workflows/update-ios-meta.yml'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh icon references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p = Path('index.html')
          s = p.read_text()
          s = re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260915-6">', s, count=1)
          s = re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/png" sizes="512x512" href="assets/app-icon-512.png?v=20260915-6">', s, count=1)
          if 'apple-mobile-web-app-title' not in s:
              s = s.replace('<meta name="apple-mobile-web-app-capable" content="yes">', '<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="توقعاتي">')
          s = re.sub(r'<meta name="app-version" content="[^"]+">', '<meta name="app-version" content="3.1-ios-icon-fixed">', s, count=1)
          p.write_text(s)

          m = Path('ucl-manifest.json')
          data = json.loads(m.read_text())
          data['icons'] = [
            {'src':'assets/app-icon-192.png?v=20260915-6','sizes':'192x192','type':'image/png','purpose':'any'},
            {'src':'assets/app-icon-512.png?v=20260915-6','sizes':'512x512','type':'image/png','purpose':'any'},
            {'src':'assets/app-icon-maskable-512.png?v=20260915-6','sizes':'512x512','type':'image/png','purpose':'maskable'}
          ]
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ucl-manifest.json
          git diff --cached --quiet || git commit -m 'Refresh iOS icon references and bust Safari cache'
          git push
