name: Polish Champions League V2.1

on:
  push:
    branches: [redesign-v2]
    paths:
      - 'scripts/polish_v2.py'
      - '.github/workflows/polish-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign-v2
          fetch-depth: 0

      - name: Apply visual polish and real club crests
        run: python scripts/polish_v2.py

      - name: Validate JavaScript
        run: node --check app.js

      - name: Verify externalized app files
        run: |
          grep -q 'href="styles.css"' index.html
          grep -q 'src="app.js"' index.html
          grep -q 'img.uefa.com/imgml/TP/teams/logos' app.js

      - name: Commit V2.1 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css app.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Polish Champions League UI and add real UEFA club crests"
            git push origin redesign-v2
          fi
