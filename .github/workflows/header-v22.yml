name: Apply Champions League V2.2 header fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_header_v22.py'
      - '.github/workflows/header-v22.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V2.2 patch
        run: python scripts/fix_header_v22.py

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css app.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix iPhone header visibility and prepare optional intro audio"
            git push origin main
          fi
