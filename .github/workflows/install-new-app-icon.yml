name: Install redesigned app icon
on:
  push:
    paths:
      - '.github/workflows/install-new-app-icon.yml'
  workflow_dispatch:

jobs:
  install-icon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and build app icons
        shell: bash
        run: |
          set -e
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F687f2fa8-7e28-4d01-aa0d-16366dd1dfd9/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAEGDezi-lrzrHF5zUDgvCgjP5tWe_Issi28itbcLL4HR&exp=1789502261&osig=AAAAAAAAAAAAAAAAAAAAAK6SDtNcyyAcTJ6pTJ-A7th2cDuB1XOTKJZvejBghfQz&signer=media-rpc&x-canva-quality=thumbnail' -o /tmp/icon.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re, json

          src = Image.open('/tmp/icon.png').convert('RGB')
          Path('assets').mkdir(exist_ok=True)

          for size, path in [
              (180,'assets/app-icon-180.png'),
              (192,'assets/app-icon-192.png'),
              (512,'assets/app-icon-512.png')]:
              out = src.resize((size,size), Image.Resampling.LANCZOS)
              out.save(path,'PNG',optimize=True)

          # Maskable icon: keep the artwork inside a safe zone.
          bg = Image.new('RGB',(512,512),(3,17,79))
          inner = src.resize((410,410), Image.Resampling.LANCZOS)
          bg.paste(inner,(51,51))
          bg.save('assets/app-icon-maskable-512.png','PNG',optimize=True)

          # iOS root fallback icons.
          a180 = Image.open('assets/app-icon-180.png').convert('RGB')
          a180.save('apple-touch-icon.png','PNG',optimize=True)
          a180.save('apple-touch-icon-180x180.png','PNG',optimize=True)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" sizes="180x180" href="assets/app-icon-180.png?v=4">', s, count=1)
          s = re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/png" sizes="512x512" href="assets/app-icon-512.png?v=4">', s, count=1)
          s = re.sub(r'<meta name="app-version" content="[^"]+">', '<meta name="app-version" content="3.2-redesigned-icon">', s, count=1)
          p.write_text(s, encoding='utf-8')

          manifest = Path('ucl-manifest.json')
          m = json.loads(manifest.read_text(encoding='utf-8'))
          m['icons'] = [
            {'src':'assets/app-icon-192.png?v=4','sizes':'192x192','type':'image/png','purpose':'any'},
            {'src':'assets/app-icon-512.png?v=4','sizes':'512x512','type':'image/png','purpose':'any'},
            {'src':'assets/app-icon-maskable-512.png?v=4','sizes':'512x512','type':'image/png','purpose':'maskable'}
          ]
          manifest.write_text(json.dumps(m, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

          # Remove temporary staging and one-off workflow files if present.
          rm -f scripts/icon_new.part00
          rm -f .github/workflows/install-new-app-icon.yml
          rm -f .github/workflows/fix-ios-icon.yml
          rm -f .github/workflows/update-ios-meta.yml
          rm -f .github/workflows/fix-mobile-header-logo.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install redesigned Champions League app icon'
          git push
