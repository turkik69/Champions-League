name: Fix mobile header and UCL logo
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-header-logo.yml'
  workflow_dispatch:

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply iPhone header and logo fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          remote = 'https://upload.wikimedia.org/wikipedia/en/thumb/f/f5/UEFA_Champions_League.svg/512px-UEFA_Champions_League.svg.png'
          s = s.replace(remote, 'assets/app-icon-512.png')
          s = s.replace('<meta name="app-version" content="3.0-ucl-identity">', '<meta name="app-version" content="3.1-mobile-header-fix">')
          p.write_text(s, encoding='utf-8')

          css = Path('ucl-identity.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* iPhone header visibility + local UCL logo fix v3.1 */'
          if marker not in c:
              c += r'''

/* iPhone header visibility + local UCL logo fix v3.1 */
.ucl-official-mark img,
.ucl-brand-mark img{
  display:block!important;
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
}

@media(max-width:760px){
  header{
    position:sticky!important;
    top:0!important;
    z-index:120!important;
    padding-top:env(safe-area-inset-top,0px)!important;
    overflow:visible!important;
  }
  .header-inner{
    display:flex!important;
    visibility:visible!important;
    opacity:1!important;
    min-height:76px!important;
    padding:8px 14px 10px!important;
    align-items:center!important;
    position:relative!important;
    z-index:2!important;
  }
  .brand{
    display:flex!important;
    visibility:visible!important;
    min-width:0!important;
    flex:1 1 auto!important;
  }
  .brand-mark,.ucl-brand-mark{
    display:grid!important;
    flex:0 0 52px!important;
    width:52px!important;
    height:52px!important;
  }
  .brand-text{
    display:block!important;
    min-width:0!important;
  }
  .header-actions{
    display:flex!important;
    visibility:visible!important;
    opacity:1!important;
    flex:0 0 auto!important;
    position:relative!important;
    z-index:3!important;
  }
  header .tabs{
    position:static!important;
    top:auto!important;
    right:auto!important;
    bottom:auto!important;
    left:auto!important;
    transform:none!important;
    width:auto!important;
    max-width:none!important;
    margin:0 12px 10px!important;
    padding:6px!important;
    z-index:1!important;
  }
  main{
    padding-top:14px!important;
  }
}

@media(max-width:430px){
  .header-inner{padding-inline:10px!important;gap:6px!important}
  .brand-mark,.ucl-brand-mark{width:46px!important;height:46px!important;flex-basis:46px!important}
  .brand-text h1{font-size:.84rem!important}
  .brand-text p{font-size:.58rem!important}
  .icon-btn{width:34px!important;height:34px!important}
}
'''
              css.write_text(c, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ucl-identity.css
          git commit -m 'Fix login logo and iPhone header overlap' || exit 0
          git push
