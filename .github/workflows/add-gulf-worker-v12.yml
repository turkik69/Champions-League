name: Add Gulf Cup automation v12
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/add_gulf_worker_v12.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker
        run: python scripts/add_gulf_worker_v12.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker-v2.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Gulf Cup prediction alerts and news automation"
            git push
          fi
