name: Apply news source v4

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_news_sources_v4.py'
      - '.github/workflows/news-source-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply news source v4 patch
        run: python scripts/patch_news_sources_v4.py

      - name: Validate worker JavaScript
        run: node --check cloudflare-worker-v2.js

      - name: Commit worker update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker-v2.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Bing and UEFA fallbacks for round news"
            git push origin main
          fi
