name: Add temporary manual test push

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-push-v10.yml'
      - 'scripts/add_test_push_v10.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add temporary test push endpoint
        run: python scripts/add_test_push_v10.py

      - name: Validate worker JavaScript
        run: node --check cloudflare-worker-v2.js

      - name: Commit worker update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker-v2.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add temporary manual push test endpoint"
            git push origin main
          fi
