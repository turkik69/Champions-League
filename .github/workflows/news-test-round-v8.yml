name: Fix news test round selection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-test-round-v8.yml'
      - 'scripts/patch_news_test_round_v8.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply news test round fix
        run: python scripts/patch_news_test_round_v8.py

      - name: Validate worker JavaScript
        run: node --check cloudflare-worker-v2.js

      - name: Commit worker update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker-v2.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix news test round selection"
            git push origin main
          fi
