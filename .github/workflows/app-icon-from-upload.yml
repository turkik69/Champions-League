name: Install uploaded app icon
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/app-icon-from-upload.yml'
jobs:
  install-icon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create app icon from embedded source and update references
        shell: bash
        run: |
          mkdir -p assets
          python3 - <<'PY'
          from pathlib import Path
          import json, re, base64

          # 512x512 optimized PNG generated from the image uploaded by the user.
          b64 = ''''''
          Path('assets/app-icon-512.png').write_bytes(base64.b64decode(b64))

          # Use the local image for iOS and PWA install icons.
          index = Path('index.html').read_text(encoding='utf-8')
          index = re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" href="assets/app-icon-512.png">', index, count=1)
          if 'rel="icon"' not in index:
              index = index.replace('<link rel="apple-touch-icon" href="assets/app-icon-512.png">', '<link rel="apple-touch-icon" href="assets/app-icon-512.png">\n<link rel="icon" type="image/png" href="assets/app-icon-512.png">')
          index = re.sub(r'<meta name="app-version" content="[^"]+">', '<meta name="app-version" content="2.4-custom-icon">', index, count=1)
          Path('index.html').write_text(index, encoding='utf-8')

          manifest_path = Path('ucl-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['icons'] = [
              {'src':'assets/app-icon-512.png','sizes':'512x512','type':'image/png','purpose':'any'},
              {'src':'assets/app-icon-512.png','sizes':'512x512','type':'image/png','purpose':'maskable'}
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app-icon-512.png index.html ucl-manifest.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Use uploaded Champions League image as install icon'
            git push
          fi