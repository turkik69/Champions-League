name: Add Gulf Cup entry
on:
  push:
    paths:
      - 'scripts/add_gulf_entry.py'
      - '.github/workflows/add-gulf-entry.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/add_gulf_entry.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Gulf Cup 27 entry to main navigation"
          git push
