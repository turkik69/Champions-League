name: Fix iOS Home Screen icon
on:
  push:
    paths:
      - '.github/workflows/fix-ios-icon.yml'
  workflow_dispatch:

jobs:
  fix-icon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dedicated iOS icon
        shell: bash
        run: |
          cat > /tmp/icon.b64 <<'B64'

B64
          base64 -d /tmp/icon.b64 > apple-touch-icon.png
          cp apple-touch-icon.png apple-touch-icon-180x180.png
          mkdir -p assets
          cp apple-touch-icon.png assets/app-icon-180.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          import re
          s=re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260915-3">', s, count=1)
          if 'apple-mobile-web-app-title' not in s:
              s=s.replace('<meta name="apple-mobile-web-app-capable" content="yes">','<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="توقعاتي">')
          s=s.replace('<meta name="app-version" content="3.0-ucl-identity">','<meta name="app-version" content="3.1-ios-icon-fix">')
          p.write_text(s)
          PY
          rm -f apple-touch-icon-v2.png apple-touch-icon-v3.png.b64 FIXME.txt _noop.txt STOP.txt zz-test.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Fix iOS Home Screen icon preview'
          git push
