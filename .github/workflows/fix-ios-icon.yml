name: Fix iOS Home Screen icon
on:
  push:
    paths:
      - '.github/workflows/fix-ios-icon.yml'
  workflow_dispatch:

jobs:
  fix-icon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build dedicated iOS icon from current app icon
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('assets/app-icon-512.png')
          img=Image.open(src).convert('RGB')
          img=img.resize((180,180), Image.Resampling.LANCZOS)
          img.save('apple-touch-icon.png','PNG',optimize=True)
          img.save('apple-touch-icon-180x180.png','PNG',optimize=True)
          Path('assets').mkdir(exist_ok=True)
          img.save('assets/app-icon-180.png','PNG',optimize=True)
          PY
      - name: Update iOS metadata and clean temporary files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260915-4">', s, count=1)
          if 'apple-mobile-web-app-title' not in s:
              s=s.replace('<meta name="apple-mobile-web-app-capable" content="yes">','<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="توقعاتي">')
          s=re.sub(r'<meta name="app-version" content="[^"]+">','<meta name="app-version" content="3.1-ios-icon-fix">',s,count=1)
          p.write_text(s)
          PY
          rm -f apple-touch-icon-v2.png apple-touch-icon-v3.png.b64 FIXME.txt _noop.txt STOP.txt zz-test.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Fix iOS Home Screen icon preview'
          git push
