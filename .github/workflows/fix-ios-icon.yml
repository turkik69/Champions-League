name: Fix iOS Home Screen icon
on:
  push:
    paths:
      - '.github/workflows/fix-ios-icon.yml'
  workflow_dispatch:

jobs:
  fix-icon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode valid PNG and update iOS metadata
        shell: bash
        run: |
          set -e
          base64 -d apple-touch-icon-v3.png.b64 > apple-touch-icon.png
          cp apple-touch-icon.png apple-touch-icon-180x180.png
          mkdir -p assets
          cp apple-touch-icon.png assets/app-icon-180.png
          file apple-touch-icon.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<link rel="apple-touch-icon" href="assets/app-icon-512.png">','<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260915-3">')
          if '<meta name="apple-mobile-web-app-title"' not in s:
              s=s.replace('<meta name="apple-mobile-web-app-capable" content="yes">','<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="توقعاتي">')
          s=s.replace('<meta name="app-version" content="3.0-ucl-identity">','<meta name="app-version" content="3.1-ios-icon-fix">')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png apple-touch-icon-180x180.png assets/app-icon-180.png index.html
          git commit -m "Fix iOS Home Screen icon PNG" || exit 0
          git push
