name: Build Champions League V2

on:
  push:
    branches: [redesign-v2]
    paths:
      - 'scripts/refactor_v2.py'
      - '.github/workflows/refactor-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign-v2
          fetch-depth: 0

      - name: Refactor and redesign
        run: python scripts/refactor_v2.py

      - name: Commit generated V2 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css app.js ucl-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Refactor app structure and apply V2 UI redesign"
            git push origin redesign-v2
          fi
