name: Protect manual test push endpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secure-test-push-v11.yml'
      - 'scripts/patch_secure_test_push_v11.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply protected test push patch
        run: python scripts/patch_secure_test_push_v11.py

      - name: Validate worker JavaScript
        run: node --check cloudflare-worker-v2.js

      - name: Commit worker update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker-v2.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Protect manual test push endpoint"
            git push origin main
          fi
