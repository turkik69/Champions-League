name: Wire push notifications
on:
  push:
    paths:
      - '.github/workflows/wire-push-notifications.yml'
  workflow_dispatch:

jobs:
  wire-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Connect push client to app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '<script src="push-config.js"></script>' not in s:
              s = s.replace('<script src="app.js"></script>', '<script src="app.js"></script>\n<script src="push-config.js"></script>\n<script src="push.js"></script>')
          import re
          s = re.sub(r'<meta name="app-version" content="[^"]+">', '<meta name="app-version" content="3.4-fcm-push">', s)
          p.write_text(s, encoding='utf-8')

          a = Path('app.js')
          t = a.read_text(encoding='utf-8')
          t = t.replace("icon:'ucl-icon-192.png'", "icon:'assets/app-icon-192.png'")
          a.write_text(t, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js
          git commit -m 'Connect FCM push client and service worker' || exit 0
          git push
