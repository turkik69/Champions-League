name: Embed Gulf Cup into current app
on:
  push:
    paths:
      - 'scripts/embed_gulf_into_app.py'
      - '.github/workflows/embed-gulf-into-app.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/embed_gulf_into_app.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html gulf.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Embed Gulf Cup inside main app'
            git push
          fi
